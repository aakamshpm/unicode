services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: unicode
      POSTGRES_PASSWORD: unicodedb_0912
      POSTGRES_DB: unicode_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
volumes:
  pgdata:
  redis_data:
